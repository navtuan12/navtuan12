<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="284" viewBox="0 0 1000 284" role="img" aria-labelledby="title desc"><title id="title">Selected career impact</title><desc id="desc">Figures from Nguyen Van Anh Tuan's CV: approximately 60–70% lower idle EC2 compute costs; CI/CD for 100+ services and 200+ builds per day; approximately 25–30% lower MTTR; MATLAB environments provisioned and torn down in under 30 minutes.</desc><g transform="translate(0 0)"><rect x="1" y="1" width="490" height="134" rx="14" fill="#f2f8fc" stroke="#cedeeb"/><text x="24" y="29" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="1.4" fill="#526b81">01 / CLOUD EFFICIENCY</text><text x="24" y="76" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#087d70">~60–70%</text><text x="24" y="108" font-family="Arial,sans-serif" font-size="14" fill="#142a43">lower idle EC2 compute costs</text></g><g transform="translate(508 0)"><rect x="1" y="1" width="490" height="134" rx="14" fill="#f2f8fc" stroke="#cedeeb"/><text x="24" y="29" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="1.4" fill="#526b81">02 / DELIVERY AT SCALE</text><text x="24" y="76" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#087d70">100+ services</text><text x="24" y="108" font-family="Arial,sans-serif" font-size="14" fill="#142a43">200+ builds per day</text></g><g transform="translate(0 148)"><rect x="1" y="1" width="490" height="134" rx="14" fill="#f2f8fc" stroke="#cedeeb"/><text x="24" y="29" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="1.4" fill="#526b81">03 / INCIDENT RESPONSE</text><text x="24" y="76" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#087d70">~25–30%</text><text x="24" y="108" font-family="Arial,sans-serif" font-size="14" fill="#142a43">reduction in mean time to recovery</text></g><g transform="translate(508 148)"><rect x="1" y="1" width="490" height="134" rx="14" fill="#f2f8fc" stroke="#cedeeb"/><text x="24" y="29" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="1.4" fill="#526b81">04 / INFRASTRUCTURE AS CODE</text><text x="24" y="76" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#087d70">&lt;30 min</text><text x="24" y="108" font-family="Arial,sans-serif" font-size="14" fill="#142a43">MATLAB environment provisioning / teardown</text></g></svg>
