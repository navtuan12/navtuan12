<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="284" viewBox="0 0 1000 284" role="img" aria-labelledby="title desc"><title id="title">Selected career impact</title><desc id="desc">Figures from Nguyen Van Anh Tuan's CV: approximately 60–70% lower idle EC2 compute costs; CI/CD for 100+ services and 200+ builds per day; approximately 25–30% lower MTTR; MATLAB environments provisioned and torn down in under 30 minutes.</desc><g transform="translate(0 0)"><rect x="1" y="1" width="490" height="134" rx="14" fill="#101c30" stroke="#29435d"/><text x="24" y="29" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="1.4" fill="#a5b8d5">01 / CLOUD EFFICIENCY</text><text x="24" y="76" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#71e3cd">~60–70%</text><text x="24" y="108" font-family="Arial,sans-serif" font-size="14" fill="#edf5ff">lower idle EC2 compute costs</text></g><g transform="translate(508 0)"><rect x="1" y="1" width="490" height="134" rx="14" fill="#101c30" stroke="#29435d"/><text x="24" y="29" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="1.4" fill="#a5b8d5">02 / DELIVERY AT SCALE</text><text x="24" y="76" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#71e3cd">100+ services</text><text x="24" y="108" font-family="Arial,sans-serif" font-size="14" fill="#edf5ff">200+ builds per day</text></g><g transform="translate(0 148)"><rect x="1" y="1" width="490" height="134" rx="14" fill="#101c30" stroke="#29435d"/><text x="24" y="29" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="1.4" fill="#a5b8d5">03 / INCIDENT RESPONSE</text><text x="24" y="76" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#71e3cd">~25–30%</text><text x="24" y="108" font-family="Arial,sans-serif" font-size="14" fill="#edf5ff">reduction in mean time to recovery</text></g><g transform="translate(508 148)"><rect x="1" y="1" width="490" height="134" rx="14" fill="#101c30" stroke="#29435d"/><text x="24" y="29" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="1.4" fill="#a5b8d5">04 / INFRASTRUCTURE AS CODE</text><text x="24" y="76" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#71e3cd">&lt;30 min</text><text x="24" y="108" font-family="Arial,sans-serif" font-size="14" fill="#edf5ff">MATLAB environment provisioning / teardown</text></g></svg>
